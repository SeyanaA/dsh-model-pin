<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pinned model">
  <defs>
    <linearGradient id="pin-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pin-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#pin-background)"/>
  <!-- A map pin: the default model is held at one fixed point. -->
  <path fill="url(#pin-body)" d="M32 8C21.5 8 13 16.5 13 27c0 13.9 19 33 19 33s19-19.1 19-33C51 16.5 42.5 8 32 8z"/>
  <!-- A four-point spark marks the pinned choice itself. -->
  <path fill="#fbbf24" d="M32 17l2.5 4.5 4.5 2.5-4.5 2.5-2.5 4.5-2.5-4.5-4.5-2.5 4.5-2.5z"/>
</svg>
